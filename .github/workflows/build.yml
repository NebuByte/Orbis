name: build

# every push and pull request: the Rust compiles and the UI script parses.
# a tag like v0.9.0: also build the Windows installer and attach it to a draft release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust compiles without warnings
        run: cargo check --release --manifest-path src-tauri/Cargo.toml
        env:
          RUSTFLAGS: -D warnings
      - name: No debugging port in a build
        shell: bash
        run: '! grep -q remote-debugging src-tauri/tauri.conf.json'
      - name: UI script parses
        run: node --check ui/app.js
      - name: Search helper parses
        run: python -c "import ast; ast.parse(open('semantic/orbis_sem.py', encoding='utf-8').read())"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install -g @tauri-apps/cli@2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: tauri
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Orbis ${{ github.ref_name }}
          releaseBody: See the README for what's new and how to use Orbis.
          releaseDraft: true
