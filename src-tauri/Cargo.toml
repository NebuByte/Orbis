[package]
name = "orbis"
version = "0.9.0"
description = "Orbis - neural file explorer and launcher"
license = "MIT"
repository = "https://github.com/NebuByte/Orbis"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
bincode = "1.3"
winreg = "0.55"
base64 = "0.22"
notify = "6.1"
dirs = "5"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
